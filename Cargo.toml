[package]
name = "pelagic-globe"
version = "1.1.0"
edition = "2021"
authors = ["Bryan P. White <crvscience.com>"]
license = "GPL-3.0-or-later"
description = "Native safe-Rust 3D ocean currents globe workstation with conformal Spilhaus World Ocean projection layer, NOAA CPC ERSSTv6 El Nino dynamics, and live NOAA CoastWatch ERDDAP / local satellite raster ingestion."
repository = "https://github.com/bpwhite/crvscience-pelagic-globe"
keywords = ["oceanography", "spilhaus", "enso", "erddap", "wgpu"]
categories = ["science", "visualization", "simulation", "graphics"]

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = true, features = ["wgpu"] }
egui = "0.31"
egui-wgpu = "0.31"
glam = { version = "0.29", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
wgpu = "24.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
